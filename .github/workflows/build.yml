name: Build and test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            qt-arch: win64_msvc2022_64
          - os: ubuntu-22.04
            qt-arch: linux_gcc_64
          - os: macos-15
            qt-arch: clang_64
          - os: macos-15-intel
            qt-arch: clang_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        if: runner.os == 'Windows'
        with:
          arch: x64
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libxkbcommon-dev libxcb-cursor0 libxcb-xinerama0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxkbcommon-x11-0 libx11-dev libxext-dev libpipewire-0.3-dev libva-x11-2 libva-drm2 xvfb openbox dbus-x11 squashfs-tools desktop-file-utils clang-tidy
      - uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730
        if: runner.os != 'Windows'
        with:
          version: '6.11.2'
          arch: ${{ matrix.qt-arch }}
          modules: 'qtmultimedia qtshadertools'
          cache: true
      - name: Install pinned Windows Qt SDK
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tools/install-qt-windows.ps1 -Destination "$env:RUNNER_TEMP/Qt"
      - name: Configure
        run: cmake --preset release
      - name: Build
        run: cmake --build --preset release --parallel 2
      - name: Test
        run: ctest --preset release
      - name: C++ static analysis
        if: runner.os == 'Linux'
        run: run-clang-tidy -p build/release -checks='-*,clang-analyzer-*' -warnings-as-errors='*' 'src/.*\.cpp$'
      - name: Linux desktop integration
        if: runner.os == 'Linux'
        run: dbus-run-session -- xvfb-run -a sh -c 'openbox >/tmp/better-pip-openbox.log 2>&1 & XDG_SESSION_TYPE=x11 QT_QPA_PLATFORM=xcb QT_QUICK_BACKEND=software ./build/release/desktop-test; result=$?; cat /tmp/better-pip-openbox.log; exit $result'
      - name: Package directory
        run: cmake --install build/release --prefix dist
      - name: Windows packages
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nsis --yes --no-progress
          ./tools/package-windows.ps1
      - name: Linux packages
        if: runner.os == 'Linux'
        run: sh tools/package-linux.sh
      - name: macOS packages
        if: runner.os == 'macOS'
        run: sh tools/package-macos.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: better-pip-${{ matrix.os }}
          path: |
            out/release/*.exe
            out/release/*.zip
            out/release/*.dmg
            out/release/*.AppImage
            out/release/*.tar.gz
            out/release/SHA256SUMS-*.txt
          if-no-files-found: error
