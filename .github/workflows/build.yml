name: Build and test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            qt-arch: win64_msvc2022_64
          - os: ubuntu-22.04
            qt-arch: linux_gcc_64
          - os: macos-15
            qt-arch: clang_64
          - os: macos-15-intel
            qt-arch: clang_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        if: runner.os == 'Windows'
        with:
          arch: x64
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libxkbcommon-dev libxcb-cursor0 libxcb-xinerama0 libx11-dev libxext-dev libpipewire-0.3-dev
      - uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730
        if: runner.os != 'Windows'
        with:
          version: '6.11.2'
          arch: ${{ matrix.qt-arch }}
          modules: 'qtmultimedia qtshadertools'
          cache: true
      - name: Install pinned Windows Qt SDK
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tools/install-qt-windows.ps1 -Destination "$env:RUNNER_TEMP/Qt"
      - name: Configure
        run: cmake --preset release
      - name: Build
        run: cmake --build --preset release --parallel 2
      - name: Test
        run: ctest --preset release
      - name: Package directory
        run: cmake --install build/release --prefix dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: better-pip-${{ matrix.os }}
          path: dist/
